<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0716"/>
      <stop offset="55%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#1b0f3d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="800" height="260" fill="url(#bgGrad)"/>

    <!-- circuit / constellation dot pattern -->
    <g stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1">
      <line x1="40" y1="40" x2="140" y2="70"/>
      <line x1="140" y1="70" x2="120" y2="150"/>
      <line x1="650" y1="30" x2="740" y2="60"/>
      <line x1="740" y1="60" x2="770" y2="140"/>
      <line x1="600" y1="220" x2="700" y2="230"/>
      <line x1="30" y1="200" x2="90" y2="230"/>
    </g>
    <g fill="#a78bfa" fill-opacity="0.55">
      <circle cx="40" cy="40" r="2.2"/>
      <circle cx="140" cy="70" r="2.2"/>
      <circle cx="120" cy="150" r="2.2"/>
      <circle cx="650" cy="30" r="2.2"/>
      <circle cx="740" cy="60" r="2.2"/>
      <circle cx="770" cy="140" r="2.2"/>
      <circle cx="600" cy="220" r="2.2"/>
      <circle cx="700" cy="230" r="2.2"/>
      <circle cx="30" cy="200" r="2.2"/>
      <circle cx="90" cy="230" r="2.2"/>
    </g>

    <circle cx="120" cy="130" r="150" fill="url(#glow)"/>

    <rect x="1" y="1" width="798" height="258" rx="18" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Header -->
    <text x="36" y="46" font-family="'Segoe UI', Verdana, sans-serif" font-size="22" font-weight="700" fill="url(#titleGrad)">⚔ LeetCode Quest</text>
    <text x="36" y="68" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" fill="#a78bfa" fill-opacity="0.8">@Akshaya2302 · Rank #5000001</text>

    <!-- Level hexagon -->
    <g transform="translate(110,158)" filter="url(#softGlow)">
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="url(#hexGrad)" stroke="#c4b5fd" stroke-width="2"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">LEVEL</text>
      <text x="0" y="26" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="30" font-weight="800" fill="#ffffff">1</text>
    </g>
    <text x="110" y="240" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="12" fill="#c4b5fd">Fresh Recruit</text>

    <!-- XP bar toward next milestone -->
    <text x="210" y="120" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" font-weight="600" fill="#e9d5ff">Next Milestone: 10 Solved</text>
    <rect x="210" y="130" width="330" height="14" rx="7" fill="#2a1a4d"/>
    <rect x="210" y="130" width="33" height="14" rx="7" fill="url(#xpGrad)" filter="url(#softGlow)"/>
    <text x="210" y="160" font-family="'Segoe UI', Verdana, sans-serif" font-size="12" fill="#a78bfa">1 / 10 XP toward Level 2</text>

    <!-- Difficulty chips -->
    <g font-family="'Segoe UI', Verdana, sans-serif">
      <!-- Easy -->
      <rect x="210" y="182" width="150" height="46" rx="10" fill="#131022" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="234" cy="205" r="6" fill="#34d399"/>
      <text x="250" y="200" font-size="11" fill="#9ca3af">EASY</text>
      <text x="250" y="216" font-size="16" font-weight="700" fill="#34d399">1 solved</text>

      <!-- Medium -->
      <rect x="370" y="182" width="150" height="46" rx="10" fill="#131022" stroke="#fbbf24" stroke-opacity="0.5"/>
      <circle cx="394" cy="205" r="6" fill="#fbbf24"/>
      <text x="410" y="200" font-size="11" fill="#9ca3af">MEDIUM</text>
      <text x="410" y="216" font-size="16" font-weight="700" fill="#fbbf24">0 solved</text>
    </g>

    <!-- Hard chip + total -->
    <g font-family="'Segoe UI', Verdana, sans-serif">
      <rect x="560" y="90" width="200" height="46" rx="10" fill="#131022" stroke="#f87171" stroke-opacity="0.5"/>
      <circle cx="584" cy="113" r="6" fill="#f87171"/>
      <text x="600" y="108" font-size="11" fill="#9ca3af">HARD</text>
      <text x="600" y="124" font-size="16" font-weight="700" fill="#f87171">0 solved</text>

      <rect x="560" y="146" width="200" height="82" rx="10" fill="#1b1236" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="660" y="172" text-anchor="middle" font-size="12" fill="#c4b5fd">TOTAL SOLVED</text>
      <text x="660" y="208" text-anchor="middle" font-size="34" font-weight="800" fill="url(#titleGrad)">1</text>
    </g>

    <text x="400" y="250" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="11.5" fill="#7c6ba8" font-style="italic">Every expert was once a beginner — grinding one problem at a time 🚀</text>
  </g>
</svg>
